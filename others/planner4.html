<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plane v1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --danger: #ef4444;
            --danger-light: #fef2f2;

            --level-1: #10b981;
            --level-2: #f59e0b;
            --level-3: #f97316;
            --level-4: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Header ── */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .btn-generate {
            padding: 8px 14px;
            font-size: 0.85rem;
            min-height: 36px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: all 0.15s;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover, .btn:active { border-color: var(--primary); color: var(--primary); }
        
        .btn-danger {
            color: var(--danger);
            border-color: #fecaca;
        }
        .btn-danger:hover, .btn-danger:active {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .btn-primary:hover, .btn-primary:active {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #fff;
        }

        /* ── Views ── */
        .view { display: none; animation: fadeUp 0.2s ease; }
        .view.active { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .view-heading {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Search ── */
        .search-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px 44px 12px 14px;
            font: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--card-bg);
            min-height: 48px;
            box-shadow: var(--shadow);
        }
        .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .search-input::placeholder { color: #94a3b8; }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
        }
        .search-clear:hover, .search-clear:active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .search-clear[hidden] { display: none; }

        .game-category {
            display: block;
            margin-top: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary);
        }

        mark.match {
            background: #fef3c7;
            color: inherit;
            border-radius: 3px;
            padding: 0 2px;
        }

        /* ── Category List ── */
        .cat-list { display: flex; flex-direction: column; gap: 8px; }

        .cat-item {
            padding: 16px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            min-height: 64px;
        }

        .cat-item:hover, .cat-item:active {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .cat-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        
        .cat-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cat-count {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .cat-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .cat-item .arrow {
            color: var(--text-muted);
            font-size: 1.4rem;
            font-weight: 300;
            transition: transform 0.15s;
        }

        .cat-item:hover .arrow, .cat-item:active .arrow { 
            transform: translateX(4px); 
            color: var(--primary); 
        }

        /* ─ Back Button & Games Heading ── */
        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
        }
        .back-btn:hover { text-decoration: underline; }

        .games-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .games-heading {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .games-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn-export-cat {
            padding: 8px 14px;
            font-size: 0.8rem;
            min-height: 36px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .games-actions .btn[hidden] { display: none; }

        /* ── Game Items ── */
        .games-list { display: flex; flex-direction: column; gap: 10px; }

        .game-item {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: border-color 0.15s;
        }

        .game-item:hover { border-color: #cbd5e1; }

        /* NEW: Title area - full width, no truncation */
        .game-title-area {
            padding: 14px 16px 12px 16px;
        }

        .game-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            word-break: break-word;
        }

        /* NEW: Strip below title with copy + arrow */
        .game-strip {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            padding: 6px 12px 10px 12px;
            border-top: 1px solid var(--border);
            background: #fafbfc;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-btn:hover, .icon-btn:active { background: var(--primary-light); color: var(--primary); }
        .icon-btn.delete-btn:hover, .icon-btn.delete-btn:active { background: var(--danger-light); color: var(--danger); }
        .icon-btn svg { width: 18px; height: 18px; }

        .expand-arrow { cursor: pointer; display: flex; align-items: center; }
        .expand-arrow svg {
            width: 20px; height: 20px;
            transition: transform 0.25s ease;
            color: var(--text-muted);
        }
        .game-item.open .expand-arrow svg {
            transform: rotate(180deg);
            color: var(--primary);
        }

        /* ── Expandable Description & Level Tag ── */
        .game-desc {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .game-item.open .game-desc {
            max-height: 1000px;
        }

        .game-desc-inner {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: #fcfcfd;
            position: relative;
        }

        .desc-text {
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 40px;
        }

        .level-tag {
            position: absolute;
            bottom: 12px;
            left: 16px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 4px;
            color: #fff;
            line-height: 1;
        }

        /* Copy, edit, and delete sit together at the bottom-right of the description */
        .desc-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .level-1 { background: var(--level-1); }
        .level-2 { background: var(--level-2); color: #0f172a; }
        .level-3 { background: var(--level-3); }
        .level-4 { background: var(--level-4); }

        /* ── Empty State ─ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ── Edit modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 900;
        }
        .modal-overlay[hidden] { display: none; }

        .modal {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow: auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.18);
            padding: 20px;
        }

        .modal-generate { max-width: 560px; }

        .field-hint {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .generate-result[hidden] { display: none; }

        #generateResult {
            min-height: 220px;
            background: #f8fafc;
        }

        .modal h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }

        .field input,
        .field textarea {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            color: var(--text);
            background: #fff;
        }
        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .field textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        @media (max-width: 500px) {
            .container { padding: 16px 12px; }
            .app-header { flex-direction: column; align-items: stretch; }
            .title-wrap { justify-content: space-between; }
            .header-actions { width: 100%; }
            .header-actions .btn { flex: 1; }
            .games-actions .btn { flex: 0 0 auto; }
            .cat-item { padding: 14px; }
            .game-title-area { padding: 12px 14px 10px 14px; }
            .game-strip { padding: 4px 10px 8px 10px; }
            .game-desc-inner { padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="app-header">
        <div class="title-wrap">
            <h1 class="app-title">Plane v1</h1>
            <button class="btn btn-primary btn-generate" id="btnGenerate" type="button">Generate</button>
        </div>
        <div class="header-actions">
            <button class="btn" id="btnExport">Export All</button>
            <button class="btn" id="btnImportTrigger">Import</button>
            <button class="btn btn-danger" id="btnDeleteAll">Delete All</button>
            <input type="file" id="fileImport" accept=".json" hidden>
        </div>
    </header>

    <main>
        <div class="search-wrap">
            <input type="search" id="gameSearch" class="search-input" placeholder="Search all games by title" autocomplete="off" spellcheck="false" aria-label="Search all games by title">
            <button type="button" class="search-clear" id="searchClear" hidden aria-label="Clear search">&times;</button>
        </div>

        <section id="viewCategories" class="view active">
            <div class="view-heading">Categories</div>
            <div id="catList" class="cat-list"></div>
        </section>

        <section id="viewSearch" class="view">
            <div class="view-heading" id="searchHeading" aria-live="polite">Matching titles</div>
            <div id="searchList" class="games-list"></div>
        </section>

        <section id="viewGames" class="view">
            <button class="back-btn" id="btnBack">&#8592; Back</button>
            <div class="games-title-row">
                <h2 class="games-heading" id="gamesHeading"></h2>
                <div class="games-actions">
                    <button class="btn btn-export-cat" id="btnToggleAll" type="button" hidden>Expand all</button>
                    <button class="btn btn-export-cat" id="btnExportCat" type="button">Export Category</button>
                </div>
            </div>
            <div id="gamesList" class="games-list"></div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="editModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="editModalTitle">
        <h3 id="editModalTitle">Edit game</h3>
        <div class="field">
            <label for="editTitle">Title</label>
            <input type="text" id="editTitle" maxlength="200" autocomplete="off">
        </div>
        <div class="field">
            <label for="editDesc">Description</label>
            <textarea id="editDesc"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn" id="editCancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="editSave" type="button">Save</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="generateModal" hidden>
    <div class="modal modal-generate" role="dialog" aria-labelledby="generateModalTitle">
        <h3 id="generateModalTitle">Generate</h3>
        <div class="field">
            <label for="generateNames">Game names</label>
            <textarea id="generateNames" placeholder="Poker&#10;Cricket&#10;Cricket + Football" spellcheck="false"></textarea>
            <p class="field-hint">One name per line. Use + on a line to include several games, such as Cricket + Football.</p>
        </div>
        <div class="modal-actions">
            <button class="btn" id="generateCancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="generateRun" type="button">Generate</button>
        </div>
        <div class="field generate-result" id="generateResultWrap" hidden>
            <label for="generateResult">Result</label>
            <textarea id="generateResult" readonly></textarea>
            <div class="modal-actions">
                <button class="btn" id="generateCopy" type="button">Copy</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// IndexedDB Setup
// ════════════════════════════════════════
const DB_NAME = 'GamePlannerDB';
const S_CAT = 'categories';
const S_GAME = 'games';
let db;
let currentCategoryId = null;

function openDB() {
    return new Promise((resolve, reject) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = e => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(S_CAT))  d.createObjectStore(S_CAT,  { keyPath: 'id' });
            if (!d.objectStoreNames.contains(S_GAME)) {
                const s = d.createObjectStore(S_GAME, { keyPath: 'id' });
                s.createIndex('categoryId', 'categoryId', { unique: false });
            }
        };
        r.onsuccess = e => { db = e.target.result; resolve(); };
        r.onerror   = e => reject(e.target.error);
    });
}

const tx = (store, mode = 'readonly') => db.transaction(store, mode).objectStore(store);
const getAll  = s => new Promise((ok, no) => { const r = tx(s).getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const getOne  = (s, id) => new Promise((ok, no) => { const r = tx(s).get(id); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const put     = (s, d) => new Promise((ok, no) => { const r = tx(s, 'readwrite').put(d); r.onsuccess = () => ok(); r.onerror = () => no(r.error); });
const del     = (s, id) => new Promise((ok, no) => { const r = tx(s, 'readwrite').delete(id); r.onsuccess = () => ok(); r.onerror = () => no(r.error); });
const clearDB = s => new Promise((ok, no) => { const r = tx(s, 'readwrite').clear(); r.onsuccess = () => ok(); r.onerror = () => no(r.error); });

function uid() { return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36); }

// ════════════════════════════════════════
// Seed Default Data
// ════════════════════════════════════════
async function seed() {
    if ((await getAll(S_CAT)).length) return;

    const cats = [
        { id: uid(), name: 'Test', icon: '🧪' },
        { id: uid(), name: 'Board Games', icon: '♟️' },
        { id: uid(), name: 'Card Games', icon: '' },
        { id: uid(), name: 'Outdoor', icon: '⚽' }
    ];
    for (const c of cats) await put(S_CAT, c);

    const games = [
        { id: uid(), categoryId: cats[0].id, title: 'Test Game Level 1', description: 'This is a test game for Level 1.\n\nIt is very easy to learn and play.', level: 1 },
        { id: uid(), categoryId: cats[0].id, title: 'Test Game Level 2', description: 'This is a test game for Level 2.\n\nIt requires some basic strategy and focus.', level: 2 },
        { id: uid(), categoryId: cats[0].id, title: 'Test Game Level 3', description: 'This is a test game for Level 3.\n\nIt is quite challenging and requires advanced planning.', level: 3 },
        { id: uid(), categoryId: cats[0].id, title: 'Test Game Level 4', description: 'This is a test game for Level 4.\n\nIt is extremely difficult and meant for experts only.', level: 4 },
        { id: uid(), categoryId: cats[1].id, title: 'Chess',    description: 'A two-player strategy board game.\n\nPlayed on an 8x8 checkered board.', level: 4 },
        { id: uid(), categoryId: cats[1].id, title: 'Checkers', description: 'A classic strategy board game.\n\nPlayers move pieces diagonally.', level: 1 },
        { id: uid(), categoryId: cats[2].id, title: 'Poker',    description: 'A family of comparing card games.\n\nPlayers wager over which hand is best.', level: 3 },
        { id: uid(), categoryId: cats[2].id, title: 'Uno',      description: 'A shedding-type card game.\n\nGoal: Be the first to play all your cards.', level: 1 },
        { id: uid(), categoryId: cats[3].id, title: 'Cricket',  description: 'A bat-and-ball game.\n\nPlayed between two teams of eleven.', level: 2 },
        { id: uid(), categoryId: cats[3].id, title: 'Football', description: 'The world\'s most popular team sport.\n\nPlayed with a spherical ball.', level: 2 }
    ];
    for (const g of games) await put(S_GAME, g);
}

// ════════════════════════════════════════
// UI Rendering
// ════════════════════════════════════════
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

function showView(id, scroll = true) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (scroll) window.scrollTo(0, 0);
}

function isSearchActive() {
    return document.getElementById('viewSearch').classList.contains('active');
}

function openGameIds(root) {
    return [...document.querySelectorAll(`${root} .game-item.open`)].map(el => el.dataset.id);
}

function highlightTitle(text, query) {
    const source = text || '';
    const q = query.trim();
    if (!q) return esc(source);
    const lower = source.toLowerCase();
    const qLower = q.toLowerCase();
    let out = '';
    let i = 0;
    while (i < source.length) {
        const idx = lower.indexOf(qLower, i);
        if (idx === -1) {
            out += esc(source.slice(i));
            break;
        }
        out += esc(source.slice(i, idx));
        out += `<mark class="match">${esc(source.slice(idx, idx + q.length))}</mark>`;
        i = idx + q.length;
    }
    return out;
}

function gameItemHtml(g, { categoryName = '', query = '', open = false } = {}) {
    const lvl = [1, 2, 3, 4].includes(parseInt(g.level)) ? parseInt(g.level) : 2;
    const displayLevel = `Level ${lvl}`;
    const meta = categoryName ? `<span class="game-category">${esc(categoryName)}</span>` : '';

    return `<div class="game-item${open ? ' open' : ''}" data-id="${g.id}">
                <div class="game-title-area">
                    <span class="game-title">${query ? highlightTitle(g.title, query) : esc(g.title)}</span>
                    ${meta}
                </div>
                <div class="game-strip">
                    <button class="icon-btn copy-btn" data-title="${esc(g.title)}" title="Copy title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                    <span class="expand-arrow" title="Expand description">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </span>
                </div>
                <div class="game-desc">
                    <div class="game-desc-inner">
                        <p class="desc-text">${esc(g.description || 'No description.')}</p>
                        <span class="level-tag level-${lvl}">${esc(displayLevel)}</span>
                        <div class="desc-actions">
                            <button class="icon-btn copy-details-btn" data-id="${g.id}" title="Copy title and description">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                            <button class="icon-btn edit-game-btn" data-id="${g.id}" title="Edit title and description">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                            </button>
                            <button class="icon-btn delete-btn delete-game-btn" data-id="${g.id}" title="Delete game">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
}

async function renderCategories() {
    const cats  = await getAll(S_CAT);
    const games = await getAll(S_GAME);
    const el    = document.getElementById('catList');

    if (!cats.length) { el.innerHTML = '<div class="empty-state">No categories. Import data to start.</div>'; return; }

    cats.sort((a, b) => a.name.localeCompare(b.name));

    el.innerHTML = cats.map(c => {
        const count = games.filter(g => g.categoryId === c.id).length;
        return `<div class="cat-item" data-id="${c.id}">
                    <div class="cat-info">
                        <span class="cat-name">${esc(c.name)}</span>
                        <span class="cat-count">${count} item${count !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="cat-actions">
                        <button class="icon-btn delete-btn delete-cat-btn" data-id="${c.id}" title="Delete Category & Games">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        <span class="arrow">&#8250;</span>
                    </div>
                </div>`;
    }).join('');
}

async function renderGames(catId, catName, reopenIds = []) {
    currentCategoryId = catId;
    document.getElementById('gamesHeading').textContent = catName;
    const games = (await getAll(S_GAME)).filter(g => g.categoryId === catId);
    const el    = document.getElementById('gamesList');

    if (!games.length) {
        el.innerHTML = '<div class="empty-state">No games in this category.</div>';
        syncToggleAllButton();
        return;
    }

    games.sort((a, b) => a.title.localeCompare(b.title));
    el.innerHTML = games.map(g => gameItemHtml(g, { open: reopenIds.includes(g.id) })).join('');
    syncToggleAllButton();
}

function syncToggleAllButton() {
    const items = [...document.querySelectorAll('#gamesList .game-item')];
    const btn = document.getElementById('btnToggleAll');
    btn.hidden = items.length === 0;
    if (!items.length) return;
    const allOpen = items.every(el => el.classList.contains('open'));
    btn.textContent = allOpen ? 'Collapse all' : 'Expand all';
    btn.setAttribute('aria-pressed', allOpen ? 'true' : 'false');
}

function toggleAllGames() {
    const items = [...document.querySelectorAll('#gamesList .game-item')];
    if (!items.length) return;
    const expand = !items.every(el => el.classList.contains('open'));
    items.forEach(el => el.classList.toggle('open', expand));
    syncToggleAllButton();
}

let searchSeq = 0;

async function renderSearchResults(reopenIds = [], seq = null) {
    const token = seq === null ? searchSeq : seq;
    const query = document.getElementById('gameSearch').value.trim();
    const heading = document.getElementById('searchHeading');
    const el = document.getElementById('searchList');
    if (!query) {
        if (token !== searchSeq) return;
        el.innerHTML = '';
        heading.textContent = 'Matching titles';
        return;
    }

    const q = query.toLowerCase();
    const [games, cats] = await Promise.all([getAll(S_GAME), getAll(S_CAT)]);
    if (token !== searchSeq) return;
    const catName = Object.fromEntries(cats.map(c => [c.id, c.name]));
    const matches = games.filter(g => (g.title || '').toLowerCase().includes(q));
    matches.sort((a, b) => a.title.localeCompare(b.title));

    const countLabel = matches.length === 1 ? '1 matching title' : `${matches.length} matching titles`;
    heading.textContent = `${countLabel} for “${query}”`;

    if (!matches.length) {
        el.innerHTML = `<div class="empty-state">No titles match “${esc(query)}”.</div>`;
        return;
    }

    el.innerHTML = matches.map(g => gameItemHtml(g, {
        categoryName: catName[g.categoryId] || 'Uncategorized',
        query,
        open: reopenIds.includes(g.id)
    })).join('');
}

function resetSearch() {
    const input = document.getElementById('gameSearch');
    input.value = '';
    document.getElementById('searchClear').hidden = true;
}

let searchTimer;
async function handleSearchInput(scrollOnEnter = false) {
    const seq = ++searchSeq;
    const input = document.getElementById('gameSearch');
    const query = input.value.trim();
    document.getElementById('searchClear').hidden = !input.value;

    if (!query) {
        await renderCategories();
        if (seq !== searchSeq) return;
        showView('viewCategories', false);
        return;
    }

    const already = isSearchActive();
    await renderSearchResults([], seq);
    if (seq !== searchSeq) return;
    if (!already) showView('viewSearch', scrollOnEnter);
}

// ════════════════════════════════════════
// Event Listeners
// ════════════════════════════════════════
function bindEvents() {
    document.getElementById('catList').addEventListener('click', e => {
        const deleteBtn = e.target.closest('.delete-cat-btn');
        if (deleteBtn) {
            e.stopPropagation();
            deleteCategory(deleteBtn.dataset.id);
            return;
        }
        const item = e.target.closest('.cat-item');
        if (item) {
            const name = item.querySelector('.cat-name').textContent.trim();
            renderGames(item.dataset.id, name);
            showView('viewGames');
        }
    });

    document.getElementById('btnBack').addEventListener('click', () => {
        const query = document.getElementById('gameSearch').value.trim();
        if (query) handleSearchInput(true);
        else showView('viewCategories');
    });

    const onGameListClick = async e => {
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
            e.stopPropagation();
            navigator.clipboard.writeText(copyBtn.dataset.title)
                .then(() => toast('Copied: ' + copyBtn.dataset.title))
                .catch(() => toast('Copy failed'));
            return;
        }

        const copyDetailsBtn = e.target.closest('.copy-details-btn');
        if (copyDetailsBtn) {
            e.stopPropagation();
            const game = await getOne(S_GAME, copyDetailsBtn.dataset.id);
            if (!game) { toast('Game not found'); return; }
            const text = `${game.title}\n\n${game.description || ''}`;
            navigator.clipboard.writeText(text.trim())
                .then(() => toast('Copied title and description'))
                .catch(() => toast('Copy failed'));
            return;
        }

        const editBtn = e.target.closest('.edit-game-btn');
        if (editBtn) {
            e.stopPropagation();
            await openEditModal(editBtn.dataset.id);
            return;
        }
        
        const deleteBtn = e.target.closest('.delete-game-btn');
        if (deleteBtn) {
            e.stopPropagation();
            deleteGame(deleteBtn.dataset.id);
            return;
        }

        const arrow = e.target.closest('.expand-arrow');
        if (arrow) {
            arrow.closest('.game-item').classList.toggle('open');
            if (arrow.closest('#gamesList')) syncToggleAllButton();
        }
    };
    document.getElementById('gamesList').addEventListener('click', onGameListClick);
    document.getElementById('searchList').addEventListener('click', onGameListClick);

    const searchInput = document.getElementById('gameSearch');
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => handleSearchInput(false), 120);
    });
    searchInput.addEventListener('search', () => handleSearchInput(false));
    document.getElementById('searchClear').addEventListener('click', () => {
        resetSearch();
        handleSearchInput(false);
        searchInput.focus();
    });

    document.getElementById('btnGenerate').addEventListener('click', openGenerateModal);
    document.getElementById('generateCancel').addEventListener('click', closeGenerateModal);
    document.getElementById('generateRun').addEventListener('click', generateGameText);
    document.getElementById('generateCopy').addEventListener('click', copyGeneratedText);
    document.getElementById('generateModal').addEventListener('click', e => {
        if (e.target.id === 'generateModal') closeGenerateModal();
    });

    document.getElementById('btnExport').addEventListener('click', exportAllData);
    document.getElementById('btnDeleteAll').addEventListener('click', deleteAllData);
    document.getElementById('btnImportTrigger').addEventListener('click', () => document.getElementById('fileImport').click());
    document.getElementById('fileImport').addEventListener('change', e => {
        if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
    });
    document.getElementById('btnExportCat').addEventListener('click', exportSingleCategory);
    document.getElementById('btnToggleAll').addEventListener('click', toggleAllGames);

    document.getElementById('editCancel').addEventListener('click', closeEditModal);
    document.getElementById('editSave').addEventListener('click', saveGameEdit);
    document.getElementById('editModal').addEventListener('click', e => {
        if (e.target.id === 'editModal') closeEditModal();
    });
    document.getElementById('editTitle').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveGameEdit(); }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (!document.getElementById('editModal').hidden) {
            closeEditModal();
            return;
        }
        if (!document.getElementById('generateModal').hidden) {
            closeGenerateModal();
            return;
        }
        if (document.getElementById('gameSearch').value) {
            resetSearch();
            handleSearchInput(false);
        }
    });
}

let editingGameId = null;

async function openEditModal(gameId) {
    const game = await getOne(S_GAME, gameId);
    if (!game) { toast('Game not found'); return; }
    editingGameId = game.id;
    document.getElementById('editTitle').value = game.title || '';
    document.getElementById('editDesc').value = game.description || '';
    document.getElementById('editModal').hidden = false;
    document.getElementById('editTitle').focus();
    document.getElementById('editTitle').select();
}

function closeEditModal() {
    editingGameId = null;
    document.getElementById('editModal').hidden = true;
}

function openGenerateModal() {
    document.getElementById('generateModal').hidden = false;
    const input = document.getElementById('generateNames');
    input.focus();
}

function closeGenerateModal() {
    document.getElementById('generateModal').hidden = true;
}

function gamesMatchingName(games, name) {
    const key = name.trim().toLowerCase();
    if (!key) return [];
    return games.filter(g => (g.title || '').trim().toLowerCase() === key);
}

const GAME_DIVIDER = '======================================';

function formatGameBlock(game) {
    const title = game.title || '';
    const description = (game.description || '').replace(/\s+$/, '');
    const body = description ? `\n\n${description}\n\n` : '\n\n';
    return `➡️ ${title} ⬅️${body}${GAME_DIVIDER}`;
}

async function generateGameText() {
    const raw = document.getElementById('generateNames').value;
    const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) {
        toast('Enter at least one game name');
        document.getElementById('generateNames').focus();
        return;
    }

    const games = await getAll(S_GAME);
    const blocks = [];
    const missing = [];

    for (const line of lines) {
        const exact = gamesMatchingName(games, line);
        const names = exact.length ? [line] : line.split('+').map(part => part.trim()).filter(Boolean);
        const seen = new Set();

        for (const name of names) {
            const key = name.toLowerCase();
            if (seen.has(key)) continue;
            seen.add(key);

            const matches = gamesMatchingName(games, name);
            if (!matches.length) {
                missing.push(name);
                continue;
            }
            matches
                .sort((a, b) => (a.title || '').localeCompare(b.title || ''))
                .forEach(game => blocks.push(formatGameBlock(game)));
        }
    }

    const resultEl = document.getElementById('generateResult');
    const wrap = document.getElementById('generateResultWrap');
    if (!blocks.length) {
        resultEl.value = '';
        wrap.hidden = true;
        toast(missing.length ? `No games found: ${missing.join(', ')}` : 'No games found');
        return;
    }

    resultEl.value = `${GAME_DIVIDER}\n${blocks.join('\n\n')}`;
    wrap.hidden = false;

    if (missing.length) toast(`Generated ${blocks.length} game${blocks.length === 1 ? '' : 's'}. Missing: ${missing.join(', ')}`);
    else toast(`Generated ${blocks.length} game${blocks.length === 1 ? '' : 's'}`);
}

function copyGeneratedText() {
    const text = document.getElementById('generateResult').value;
    if (!text) { toast('Nothing to copy'); return; }
    navigator.clipboard.writeText(text)
        .then(() => toast('Copied generated text'))
        .catch(() => toast('Copy failed'));
}

async function saveGameEdit() {
    if (!editingGameId) return;
    const title = document.getElementById('editTitle').value.trim();
    const description = document.getElementById('editDesc').value;
    if (!title) {
        toast('Title cannot be empty');
        document.getElementById('editTitle').focus();
        return;
    }

    const game = await getOne(S_GAME, editingGameId);
    if (!game) {
        closeEditModal();
        toast('Game not found');
        return;
    }

    game.title = title;
    game.description = description;
    await put(S_GAME, game);

    const searching = isSearchActive();
    const reopen = searching ? openGameIds('#searchList') : openGameIds('#gamesList');
    const heading = document.getElementById('gamesHeading').textContent;
    closeEditModal();
    if (searching) await renderSearchResults(reopen);
    else await renderGames(currentCategoryId, heading, reopen);
    toast('Title and description saved');
}

// ════════════════════════════════════════
// Deletion Logic
// ════════════════════════════════════════
async function deleteAllData() {
    const input = prompt("⚠️ WARNING: This will permanently delete ALL categories and games.\n\nTo confirm, please type the safety keyword: 1234");
    if (input === "1234") {
        await clearDB(S_CAT);
        await clearDB(S_GAME);
        resetSearch();
        await renderCategories();
        showView('viewCategories');
        toast('All data deleted successfully');
    } else if (input !== null) {
        toast('Incorrect keyword. Deletion cancelled.');
    }
}

async function deleteCategory(catId) {
    if (!confirm("Are you sure you want to delete this category and ALL games inside it?")) return;
    
    const games = (await getAll(S_GAME)).filter(g => g.categoryId === catId);
    for (const g of games) {
        await del(S_GAME, g.id);
    }
    await del(S_CAT, catId);
    
    await renderCategories();
    showView('viewCategories');
    toast('Category and its games deleted');
}

async function deleteGame(gameId) {
    if (!confirm("Are you sure you want to delete this game?")) return;
    
    await del(S_GAME, gameId);
    if (isSearchActive()) await renderSearchResults();
    else await renderGames(currentCategoryId, document.getElementById('gamesHeading').textContent);
    toast('Game deleted');
}

// ════════════════════════════════════════
// Export / Import Logic
// ════════════════════════════════════════
async function exportAllData() {
    const cats  = await getAll(S_CAT);
    const games = await getAll(S_GAME);
    cats.sort((a, b) => a.name.localeCompare(b.name));

    const nested = cats.map(c => ({
        id: c.id, name: c.name, icon: c.icon || "",
        games: games.filter(g => g.categoryId === c.id).map(g => ({
            id: g.id, title: g.title, description: g.description, level: g.level
        }))
    }));

    downloadJson({ categories: nested }, `all-games-${new Date().toISOString().slice(0,10)}.json`);
    toast('All data exported');
}

async function exportSingleCategory() {
    if (!currentCategoryId) return;
    const cats = await getAll(S_CAT);
    const cat = cats.find(c => c.id === currentCategoryId);
    if (!cat) return;

    const games = (await getAll(S_GAME)).filter(g => g.categoryId === currentCategoryId);
    games.sort((a, b) => a.title.localeCompare(b.title));

    const nested = [{
        id: cat.id, name: cat.name, icon: cat.icon || "",
        games: games.map(g => ({ id: g.id, title: g.title, description: g.description, level: g.level }))
    }];

    const safeName = cat.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    downloadJson({ categories: nested }, `${safeName}-${new Date().toISOString().slice(0,10)}.json`);
    toast('Category exported');
}

function downloadJson(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}

async function importData(file) {
    const text = await file.text();
    try {
        const data = JSON.parse(text);
        if (!Array.isArray(data.categories)) throw new Error('Bad format');

        for (const cat of data.categories) {
            if (!cat.id) cat.id = uid(); 
            await put(S_CAT, { id: cat.id, name: cat.name || 'Unnamed', icon: cat.icon || '' });

            if (Array.isArray(cat.games)) {
                for (const g of cat.games) {
                    if (!g.id) g.id = uid(); 
                    await put(S_GAME, {
                        id: g.id, categoryId: cat.id, title: g.title || 'Untitled',
                        description: g.description || '', level: g.level !== undefined ? g.level : 2
                    });
                }
            }
        }
        resetSearch();
        await renderCategories();
        showView('viewCategories');
        toast('Merged successfully');
    } catch (err) {
        console.error(err);
        toast('Invalid JSON file');
    }
}

// ════════════════════════════════════════
// Utilities
// ════════════════════════════════════════
let toastTimer;
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ════════════════════════════════════════
// Init
// ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
    try {
        await openDB();
        await seed();
        await renderCategories();
        bindEvents();
    } catch (err) {
        console.error("Initialization error:", err);
        toast("Error loading app. Check console.");
    }
});
</script>
